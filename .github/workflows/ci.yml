name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_PIN: ruff@0.15.10
  TY_PIN: ty@0.0.31
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Create venv and install package
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          VIRTUAL_ENV=.venv uv pip install -e .

      - name: ruff format check
        run: uvx ${{ env.RUFF_PIN }} format --check src tests tools

      - name: ruff lint
        run: uvx ${{ env.RUFF_PIN }} check src tests tools

      - name: ty type check
        run: uvx ${{ env.TY_PIN }} check --python .venv src tests

  custom-checks:
    name: custom checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: file size limits
        run: python tools/ci/file_size.py

  tests:
    name: pytest (no-device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Create venv and install package
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          VIRTUAL_ENV=.venv uv pip install -e ".[dev]"

      - name: pytest
        run: .venv/bin/python -m pytest tests/ -q
